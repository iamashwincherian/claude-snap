name: ClaudeSnap
options:
  bundleIdPrefix: dev.ashwincherian
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

configs:
  Debug: debug
  Release: release

settingGroups:
  common:
    base:
      SWIFT_VERSION: "5.0"
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      PRODUCT_BUNDLE_IDENTIFIER: dev.ashwincherian.ClaudeSnap
      ENABLE_HARDENED_RUNTIME: YES
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: "88V8YTB2ZK"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.2.0
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.2.0
  LaunchAtLogin:
    url: https://github.com/sindresorhus/LaunchAtLogin-Modern
    from: 1.0.0

targets:
  ClaudeSnap:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: ClaudeSnap
        excludes:
          - "Resources/Assets.xcassets"
          - "Resources/Info.plist"
      - path: ClaudeSnap/Resources/Assets.xcassets
    info:
      path: ClaudeSnap/Resources/Info.plist
      properties:
        LSUIElement: true
        NSHighResolutionCapable: true
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSHumanReadableCopyright: ""
        NSAppleEventsUsageDescription: "Claude Snap reads the working directory of your frontmost Finder or editor window so the terminal opens in the right place."
    entitlements:
      path: ClaudeSnap/Resources/ClaudeSnap.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.automation.apple-events: true
    settings:
      groups:
        - common
    dependencies:
      - package: SwiftTerm
      - package: KeyboardShortcuts
      - package: LaunchAtLogin
